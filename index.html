<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Егор Кацура — загрузка сайта</title>
<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;display:flex;align-items:center;
justify-content:center;background:#080808;color:#f4e2b5;
font-family:Arial,sans-serif;overflow:hidden
}
.loader{width:100%;padding:30px;text-align:center;animation:appear 1.2s ease both}
.line{width:90px;height:2px;margin:0 auto 30px;background:linear-gradient(90deg,transparent,#d6b36a,transparent);animation:glow 2s infinite}
h1{margin:0;font-size:clamp(30px,7vw,64px);font-weight:400;letter-spacing:.12em}
.subtitle{margin-top:18px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#b99a5b}
.status{margin-top:60px;color:#a9a18f;font-size:12px;letter-spacing:.1em}
.progress{width:min(280px,70vw);height:2px;margin:18px auto;background:#29251d;overflow:hidden}
.progress span{display:block;width:35%;height:100%;background:#d6b36a;animation:loading 1.6s ease-in-out infinite}
@keyframes loading{from{transform:translateX(-110%)}to{transform:translateX(400%)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main class="loader">
<div class="line"></div>
<h1>Егор Кацура</h1>
<div class="subtitle">Ведущий · Музыкант · Шоумен</div>
<div class="status" id="status">Подготавливаем для вас атмосферу...</div>
<div class="progress"><span></span></div>
</main>
<script>
const site='https://egorkatsura.onrender.com/';
const status=document.getElementById('status');

setTimeout(()=>{
status.textContent='Секунду, сайт просыпается...';
window.location.href=site;
},5000);
</script>
</body>
</html>
